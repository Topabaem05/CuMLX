name: Action test

# Proves the action from this repository: a clean port passes, and a port with a defect fails and is located.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  action:
    name: Clean port passes, faulty port fails
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Create the original model
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install '.[capture]'
          cumlx fixture tiny-llama -o examples/port-ci/original
      - name: Clean port
        id: clean
        uses: ./
        with:
          original: original
          port: original
          loader: python:port.loader:load
          token-ids: 1,5,9,23,7,99,3,64,12,8
          working-directory: examples/port-ci
          artifact-name: report-clean
      - name: Faulty port
        id: faulty
        continue-on-error: true
        uses: ./
        with:
          original: original
          port: original
          loader: python:port.loader_faulty:load
          token-ids: 1,5,9,23,7,99,3,64,12,8
          working-directory: examples/port-ci
          artifact-name: report-faulty
      - name: The results must be exactly these
        env:
          CLEAN: ${{ steps.clean.outputs.verdict }}
          FAULTY: ${{ steps.faulty.outputs.verdict }}
          FAULTY_OUTCOME: ${{ steps.faulty.outcome }}
          MODULE: ${{ steps.faulty.outputs.first-divergence }}
        run: |
          echo "clean=$CLEAN faulty=$FAULTY outcome=$FAULTY_OUTCOME module=$MODULE"
          test "$CLEAN" = ok
          test "$FAULTY" = diverged
          test "$FAULTY_OUTCOME" = failure
          test "$MODULE" = model.layers.1.self_attn
