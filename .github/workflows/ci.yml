name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Python lint and generated kernels
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install ruff==0.11.13 mypy==2.4.1 numpy
      - name: Lint
        run: python -m ruff check .
      - name: Type check the modules that are held to it
        run: >-
          python -m mypy src/cumlx/verify/checkpoint.py src/cumlx/verify/checkop.py src/cumlx/verify/report_html.py src/cumlx/render/compare.py src/cumlx/render/sensors.py
          src/cumlx/verify/trace_compare.py src/cumlx/verify/metrics.py src/cumlx/verify/mapping.py
          src/cumlx/verify/weights.py src/cumlx/verify/portability.py src/cumlx/verify/recipes.py src/cumlx/verify/run_compare.py src/cumlx/compat/runner.py src/cumlx/mcp_server.py
          src/cumlx/verify/opgolden.py src/cumlx/verify/kernel_source.py src/cumlx/verify/kernel_capture.py src/cumlx/verify/kernel_verify.py src/cumlx/verify/kernel_port.py
      - name: Python syntax
        run: python -m compileall -q src tests scripts benchmarks
      - name: Check generated sources match the generator
        run: |
          python scripts/generate_kernels.py
          git diff --exit-code -- src/cumlx/kernels
          test -z "$(git ls-files --others --exclude-standard src/cumlx/kernels)"

  cpu:
    name: CPU reference (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install CPU dependencies only
        run: python -m pip install -e '.[dev]'
      - name: Host compiler is required for helper tests
        run: c++ --version
      - name: CPU tests (GPU tests are deselected, not claimed as passed)
        run: python -m pytest -q -m 'not gpu' --junitxml=ci-results/pytest.xml
      - name: CPU example and environment
        run: |
          python scripts/cpu_example.py > ci-results/cpu-example.json
          python scripts/env_report.py > ci-results/environment.json
      - name: Publish CPU evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cpu-python-${{ matrix.python }}
          path: ci-results/
          if-no-files-found: error
          retention-days: 14

  verifier:
    name: Verifier end-to-end (PyTorch CPU + MLX CPU)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install CPU-only PyTorch, then the capture and diff extras
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev,capture,diff]'
      - name: Environment must be ready (missing dependency = failure)
        run: |
          mkdir -p ci-results
          cumlx doctor --probe --require capture,diff,conform,weights --format json > ci-results/doctor.json
      - name: End-to-end tests (skips are failures here)
        run: python -m pytest -q -m e2e --require-e2e --junitxml=ci-results/e2e.xml
      - name: Selftest (clean port passes, injected faults located)
        run: cumlx selftest --format json > ci-results/selftest.json
      - name: FP4 conformance of the installed MLX (findings are reported, not a CI failure)
        shell: bash
        run: |
          set +e
          cumlx conform --target mlx -o ci-results/conform.json --format json > ci-results/conform-result.json
          code=$?
          if [ "$code" -ne 0 ] && [ "$code" -ne 1 ]; then cat ci-results/conform-result.json; exit "$code"; fi
      - name: Publish verifier evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verifier-e2e
          path: ci-results/
          if-no-files-found: error
          retention-days: 14

  build:
    name: Build distributions and isolated wheel smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Install wheel outside the checkout
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/wheel-venv"
          "$RUNNER_TEMP/wheel-venv/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-venv/bin/python" -I "$GITHUB_WORKSPACE/scripts/wheel_smoke.py"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 14
