name: GPU validation (manual, real hardware)

on:
  workflow_dispatch:
    inputs:
      backend:
        description: Physical backend on a registered self-hosted runner
        type: choice
        required: true
        default: metal
        options: [metal, cuda]

permissions:
  contents: read

concurrency:
  group: gpu-${{ inputs.backend }}
  cancel-in-progress: false

jobs:
  gpu:
    name: Required physical ${{ inputs.backend }} tests
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, '${{ inputs.backend }}']
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install selected MLX backend
        env:
          BACKEND: ${{ inputs.backend }}
        run: python -m pip install -e ".[dev,$BACKEND]"
      - name: Collect physical environment
        run: |
          mkdir -p ci-results
          python scripts/env_report.py > ci-results/environment.json
      - name: Require actual GPU; missing device is a failure
        env:
          CUMLX_TEST_BACKEND: ${{ inputs.backend }}
        run: python -m pytest -q -m gpu --require-gpu --junitxml=ci-results/gpu.xml
      - name: Upload evidence (never a blanket GPU certification)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gpu-${{ inputs.backend }}-${{ github.sha }}
          path: ci-results/
          if-no-files-found: error
          retention-days: 14
