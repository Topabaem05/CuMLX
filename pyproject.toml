[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cumlx-lab"
version = "0.3.0.dev0"
description = "Experimental packed FP4 kernels for MLX Metal and native CUDA"
requires-python = ">=3.10"
readme = "README.md"
license = {text = "MIT"}
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=8"]
metal = ["mlx==0.32.2; sys_platform == 'darwin' and platform_machine == 'arm64'"]
cuda = ["mlx[cuda12]==0.32.2; sys_platform == 'linux'"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cumlx = ["kernels/*.metal", "kernels/*.cu", "kernels/*.h", "py.typed"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["gpu: requires a real selected Metal or CUDA GPU"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
# Initial correctness gate. Formatting/style expansion is a separate change.
select = ["E9", "F63", "F7", "F82"]
