[workspace]
resolver = "2"
members = ["cumlx", "cumlx-rs"]

[workspace.package]
version = "0.5.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/Topabaem05/CuMLX"
publish = false

[workspace.dependencies]
serde_json = { version = "=1.0.154", default-features = false, features = ["std", "preserve_order", "float_roundtrip"] }
